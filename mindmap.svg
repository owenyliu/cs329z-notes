<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600"><rect width="680" height="600" fill="#FFFFFF"/><path d="M240 235 L230 235 L230 158 L222 158" stroke="#B4B2A9" stroke-width="1" fill="none"/><path d="M440 235 L450 235 L450 158 L458 158" stroke="#B4B2A9" stroke-width="1" fill="none"/><path d="M240 245 L230 245 L230 448 L222 448" stroke="#B4B2A9" stroke-width="1" fill="none"/><path d="M440 245 L450 245 L450 448 L458 448" stroke="#B4B2A9" stroke-width="1" fill="none"/><line x1="340" y1="270" x2="340" y2="348" stroke="#B4B2A9" stroke-width="1" fill="none"/><line x1="340" y1="150" x2="340" y2="198" stroke="#B4B2A9" stroke-width="1" fill="none" stroke-dasharray="3 3"/><text x="340" y="28" text-anchor="middle" dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:16px;font-weight:500" fill="#2C2C2A">CS329Z · What Data Do Agents Need? 智能体需要什么数据？</text><rect x="240" y="70" width="200" height="80" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340" y="94" text-anchor="middle" dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:14px;font-weight:500" fill="#2C2C2A">Key idea 核心思想</text><text x="340" y="116" text-anchor="middle" dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#5F5E5A">Data drives improvement</text><text x="340" y="134" text-anchor="middle" dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#5F5E5A">数据驱动系统改进</text><rect x="240" y="200" width="200" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="340" y="224" text-anchor="middle" dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:14px;font-weight:500" fill="#2C2C2A">What data do agents need?</text><text x="340" y="246" text-anchor="middle" dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#5F5E5A">智能体需要什么数据？</text><rect x="20" y="60" width="200" height="196" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="34" y="84"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:14px;font-weight:500" fill="#3C3489">Types of data</text><text x="34" y="104"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12.01px" fill="#534AB7">数据类型</text><text x="34" y="134"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#3C3489">Traces: full agent runs</text><text x="34" y="152"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#534AB7">轨迹：完整运行记录</text><text x="34" y="178"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#3C3489">Demos: expert examples</text><text x="34" y="196"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#534AB7">示范：专家示例</text><text x="34" y="222"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#3C3489">Feedback: scores, edits</text><text x="34" y="240"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#534AB7">反馈：评分、修改</text><rect x="460" y="60" width="200" height="196" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="474" y="84"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:14px;font-weight:500" fill="#3C3489">Optimize vs evaluate</text><text x="474" y="104"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12.01px" fill="#534AB7">优化数据 vs 评估数据</text><text x="474" y="134"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#3C3489">Optimize: improve system</text><text x="474" y="152"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#534AB7">优化：用来改进系统</text><text x="474" y="178"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#3C3489">Evaluate: measure it</text><text x="474" y="196"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#534AB7">评估：用来衡量系统</text><text x="474" y="222"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#3C3489">Never mix them (leakage)</text><text x="474" y="240"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#534AB7">绝不能混用（数据泄漏）</text><rect x="20" y="350" width="200" height="196" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="34" y="374"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:14px;font-weight:500" fill="#085041">Data flywheel</text><text x="34" y="394"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12.01px" fill="#0F6E56">数据飞轮</text><text x="34" y="424"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#085041">Deploy → log → find errors</text><text x="34" y="442"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#0F6E56">部署 → 记录 → 找错误</text><text x="34" y="468"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#085041">Fix → redeploy → repeat</text><text x="34" y="486"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#0F6E56">修复 → 再部署 → 循环</text><text x="34" y="512"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#085041">Each loop adds data</text><text x="34" y="530"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#0F6E56">每转一圈都积累数据</text><rect x="240" y="350" width="200" height="196" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="254" y="374"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:14px;font-weight:500" fill="#085041">Synthetic data</text><text x="254" y="394"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12.01px" fill="#0F6E56">合成数据</text><text x="254" y="424"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#085041">LLM writes tasks, runs</text><text x="254" y="442"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#0F6E56">用 LLM 生成任务和轨迹</text><text x="254" y="468"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#085041">Cheap and scalable</text><text x="254" y="486"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#0F6E56">便宜、可扩展</text><text x="254" y="512"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#085041">Risk: unrealistic, biased</text><text x="254" y="530"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#0F6E56">风险：不真实、有偏差</text><rect x="460" y="350" width="200" height="196" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="474" y="374"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:14px;font-weight:500" fill="#085041">Human–agent interaction</text><text x="474" y="394"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12.01px" fill="#0F6E56">人机交互数据</text><text x="474" y="424"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#085041">Explicit: thumbs, ratings</text><text x="474" y="442"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#0F6E56">显式：点赞、打分</text><text x="474" y="468"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#085041">Implicit: retries, edits</text><text x="474" y="486"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#0F6E56">隐式：重试、用户修改</text><text x="474" y="512"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#085041">Real, but noisy, sparse</text><text x="474" y="530"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#0F6E56">真实，但噪声大、稀疏</text><rect x="20" y="570" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="38" y="576"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#5F5E5A">What the data is 数据是什么</text><rect x="230" y="570" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="248" y="576"  dominant-baseline="central" style="font-family:'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Helvetica,Arial,sans-serif;font-size:12px" fill="#5F5E5A">Where it comes from 数据从哪来</text></svg>